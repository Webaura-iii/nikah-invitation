<body class="locked">
<!-- shared floral artwork (original vector, no photos of people) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>

 <g fill="#e8bdb7"><circle cx="46" cy="38" r="30"/><circle cx="112" cy="58" r="22"/><circle cx="26" cy="100" r="17"/><circle cx="168" cy="20" r="14"/></g>
 <g fill="none" stroke="#c48c87" stroke-width="1.4"><circle cx="46" cy="38" r="20"/><circle cx="46" cy="38" r="10"/><circle cx="112" cy="58" r="14"/><circle cx="112" cy="58" r="6"/><circle cx="26" cy="100" r="9"/></g>
 <g fill="#fff" opacity=".85"><circle cx="86" cy="14" r="5"/><circle cx="150" cy="96" r="5"/><circle cx="70" cy="70" r="4"/><circle cx="188" cy="64" r="4"/></g>
</symbol></defs></svg>

<div id="intro" role="dialog" aria-label="Invitation envelope">
  <button id="skip" class="ghost" data-i18n="skip">Skip</button>
  <p class="intro-bis" lang="ar" dir="rtl">بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ</p>
  <div class="env"><div class="card"><span class="script" id="introNames"></span></div><div class="env-front"></div><div class="flap"></div>
    <button id="seal" class="seal" aria-label="Open invitation"><span id="monogram"></span></button></div>
  <p class="hint" data-i18n="tap"></p>
</div>

<nav class="bar" aria-label="Controls">
  <div class="langs" role="group" aria-label="Language"><button data-lang="en">English</button><button data-lang="ur" lang="ur">اردو</button></div>
  <button id="music" class="ghost" hidden></button>
  <button id="replay" class="ghost" data-i18n="replay"></button>
</nav>

<main id="main" tabindex="-1">
  <section class="scene" id="sBis">
    <p class="eyebrow" data-i18n="begin"></p>
    <p class="bis write" lang="ar" dir="rtl" style="font-size:2.4rem">بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ</p>
    <p class="ayah ar write" lang="ar" dir="rtl" id="ayah"></p>
    <p class="sub" id="verseTr"></p>
    <cite id="verseRef"></cite>
  </section>

  <section class="scene" id="sNames">
    <p class="ar2" lang="ar" dir="rtl">إِنْ شَاءَ ٱللَّهُ</p>
    <p class="eyebrow" data-i18n="invite"></p>
    <h1 class="names script" id="heroNames" style="margin:.3rem 0"></h1>
    <p class="sub" data-i18n="welcome"></p>
    <p class="month" id="heroDate"></p>
  </section>

  <section class="scene" id="sSave">
    <h2 class="script ttl" data-i18n="save"></h2>
    <p class="month" id="calTitle"></p>
    <div class="cal" id="cal"></div>
    <div class="count" id="count"></div>
  </section>

  <section class="scene" id="sFam">
    <p class="bis sm" lang="ar" dir="rtl">بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ</p>
    <p class="eyebrow" data-i18n="families"></p>
    <p id="familyText"></p>
    <p class="ar2" lang="ar" dir="rtl">إِنْ شَاءَ ٱللَّهُ</p>
  </section>

  <div id="evScenes"></div>

  <section class="scene" id="sNotes"><h2 class="script ttl" data-i18n="notes"></h2><ul class="notes" id="notes"></ul></section>

  <section class="scene" id="sRsvp">
    <h2 class="script ttl" data-i18n="rsvp"></h2>
    <p class="demo" id="demoNote"></p>
    <form id="rsvpForm" novalidate>
      <label><span data-i18n="name"></span><input name="name" required autocomplete="name"></label>
      <label><span data-i18n="guests"></span><input name="guests" type="number" min="1" max="10" value="1"></label>
      <fieldset><legend data-i18n="which"></legend><div id="evChecks"></div></fieldset>
      <label><span data-i18n="status"></span><select name="status"><option value="yes" data-i18n="yes"></option><option value="no" data-i18n="no"></option></select></label>
      <label><span data-i18n="msg"></span><textarea name="msg" rows="2"></textarea></label>
      <p class="err" id="err" role="alert"></p>
      <button class="btn" type="submit" data-i18n="send"></button>
    </form>
    <p class="ok" id="ok" role="status"></p>
  </section>

  <section class="scene" id="sEnd">
    <p class="bis write" lang="ar" dir="rtl" id="duaAr" style="font-size:1.7rem"></p>
    <p class="sub" id="duaTr"></p><p class="small" id="duaRef"></p>
    <h2 class="script ttl" data-i18n="thanks"></h2>
    <p class="sub" id="thanksText"></p>
    <div>
      <button class="btn" id="calBtn" data-i18n="calb"></button><button class="btn" id="wa" data-i18n="wa"></button><button class="btn" id="copy" data-i18n="copy"></button>
    </div>
    <button class="ghost" id="top" data-i18n="top"></button>
  </section>
</main>

};
const I18N = {
  en: { skip:"Skip", tap:"Touch the seal to open", replay:"Replay", begin:"Let's begin with the name of Allah", invite:"Together with their families", welcome:"With gratitude to Allah, we joyfully invite you to celebrate our wedding.", save:"Save the Date", families:"With the blessings of our families", join:"We cordially invite you to the", notes:"Guest Information", rsvp:"RSVP", name:"Guest name", guests:"Number of guests", which:"Which gatherings will you attend?", status:"Attendance", yes:"Insha'Allah, I will attend", no:"Unable to attend", msg:"Message or dietary note (optional)", send:"Send RSVP", calb:"Add to calendar", wa:"Share on WhatsApp", copy:"Copy link", thanks:"Jazakumullahu khayran", top:"Back to top", d:"Days", h:"Hours", m:"Mins", s:"Secs", map:"Google Maps", dress:"Dress code", expired:"The wedding day has arrived. Barakallahu lakuma!", errName:"Please enter your name.", errEv:"Please select at least one gathering.", ok:"Thank you! Your RSVP is ready.", demo:"Demo form: replies are not stored. Connect WhatsApp or a form service.", copied:"Copied", music:"Music", mute:"Mute", waMsg:"You are invited to our wedding:", loc:"en-GB" },
  ur: { skip:"چھوڑیں", tap:"کھولنے کے لیے مہر کو چھوئیں", replay:"دوبارہ", begin:"اللہ کے نام سے آغاز", invite:"اپنے اہلِ خانہ کے ساتھ", welcome:"اللہ کے شکر کے ساتھ، ہم آپ کو اپنی شادی کی خوشی میں شرکت کی دعوت دیتے ہیں۔", save:"تاریخ محفوظ کریں", families:"ہمارے اہلِ خانہ کی دعاؤں کے ساتھ", join:"آپ کو دعوت دی جاتی ہے", notes:"مہمانوں کے لیے معلومات", rsvp:"جوابِ دعوت", name:"مہمان کا نام", guests:"مہمانوں کی تعداد", which:"آپ کن تقریبات میں شرکت کریں گے؟", status:"حاضری", yes:"ان شاء اللہ، میں شرکت کروں گا/گی", no:"شرکت سے قاصر ہوں", msg:"پیغام یا کھانے کا نوٹ (اختیاری)", send:"جواب بھیجیں", calb:"کیلنڈر میں شامل کریں", wa:"واٹس ایپ پر شیئر کریں", copy:"لنک کاپی کریں", thanks:"جزاک اللہ خیراً", top:"اوپر جائیں", d:"دن", h:"گھنٹے", m:"منٹ", s:"سیکنڈ", map:"گوگل میپس", dress:"لباس", expired:"شادی کا دن آ گیا۔ بارک اللہ لکما!", errName:"براہِ کرم اپنا نام لکھیں۔", errEv:"کم از کم ایک تقریب منتخب کریں۔", ok:"شکریہ! آپ کا جواب تیار ہے۔", demo:"ڈیمو فارم: جوابات محفوظ نہیں ہوتے۔ واٹس ایپ یا فارم سروس جوڑیں۔", copied:"کاپی ہو گیا", music:"موسیقی", mute:"بند کریں", waMsg:"آپ ہماری شادی میں مدعو ہیں:", loc:"ur-PK" },
};
/* ===================== END OF EDITABLE SECTION ===================== */

const $ = (s) => document.querySelector(s);
const evs = CONFIG.events.filter((e) => e.enabled);
const target = new Date(evs[0].start);
let lang = CONFIG.defaultLang, audio;
try { const s = localStorage.getItem("lang"); if (CONFIG.languages.includes(s)) lang = s; } catch (e) {}
const tr = (o) => (o && (o[lang] || o.en)) || "";
const L = (k) => I18N[lang][k] ?? I18N.en[k];
// venue-local date parts (read straight from the ISO string, so guests in other time zones see the venue's time)
const P = (iso) => ({ y: +iso.slice(0, 4), mo: +iso.slice(5, 7), d: +iso.slice(8, 10), h: +iso.slice(11, 13), mi: +iso.slice(14, 16) });
const F = (iso, o) => { const p = P(iso); return new Intl.DateTimeFormat(L("loc"), { ...o, timeZone: "UTC" }).format(Date.UTC(p.y, p.mo - 1, p.d, p.h, p.mi)); };
const names = () => `${tr(CONFIG.couple.groom)} ${lang === "ur" ? "اور" : "&"} ${tr(CONFIG.couple.bride)}`;
const mapLink = (e) => CONFIG.mapUrls[e.id] || "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(e.venue + " " + e.address);

/* scene decoration: drawing arch frame + florals + staggered children */
const FRAME = '<svg class="frame" viewBox="0 0 300 440" preserveAspectRatio="none" aria-hidden="true"><path pathLength="1" d="M6 434V190C6 150 40 128 70 108C104 86 134 60 150 6C166 60 196 86 230 108C260 128 294 150 294 190V434"/></svg>';
const FL = ["l", "r", "bl", "br"].map((c) => `<svg class="fl ${c}" viewBox="0 0 200 140" aria-hidden="true"><use href="#fl"/></svg>`).join("");
function decorate(s) {
  if (s.querySelector(".frame")) return;
  s.insertAdjacentHTML("afterbegin", FRAME + FL);
  [...s.children].filter((c) => !c.matches(".frame,.fl")).forEach((c, i) => c.style.setProperty("--i", i));
}
const io = new IntersectionObserver((es) => es.forEach((e) => e.target.classList.toggle("in", e.isIntersecting)), { threshold: 0.45 });
const scenes = () => document.querySelectorAll(".scene");
function startScenes() { io.disconnect(); scenes().forEach((s) => { s.classList.remove("in"); io.observe(s); }); }

function render() {
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "ur" ? "rtl" : "ltr";
  document.querySelectorAll("[data-i18n]").forEach((el) => (el.textContent = L(el.dataset.i18n)));
  document.querySelectorAll("[data-lang]").forEach((b) => { b.hidden = !CONFIG.languages.includes(b.dataset.lang); b.setAttribute("aria-current", b.dataset.lang === lang); });
  $("#heroNames").textContent = $("#introNames").textContent = names();
  $("#monogram").textContent = CONFIG.couple.groom.en[0] + CONFIG.couple.bride.en[0];
  $("#heroDate").textContent = F(evs[0].start, { dateStyle: "full" });
  $("#sBis").querySelectorAll(".ayah,#verseTr,#verseRef").forEach((el) => (el.hidden = !CONFIG.verse.enabled));
  $("#ayah").textContent = CONFIG.verse.ar; $("#verseTr").textContent = tr(CONFIG.verse.tr); $("#verseRef").textContent = tr(CONFIG.verse.ref);
  $("#familyText").textContent = tr(CONFIG.families);
  $("#duaAr").textContent = CONFIG.dua.ar; $("#duaTr").textContent = tr(CONFIG.dua.tr); $("#duaRef").textContent = tr(CONFIG.dua.ref);
  $("#thanksText").textContent = tr(CONFIG.thanks);
  $("#demoNote").textContent = CONFIG.rsvp.whatsapp ? "" : L("demo");
  // calendar for the month of the first event
  const p = P(evs[0].start), first = new Date(Date.UTC(p.y, p.mo - 1, 1)), days = new Date(Date.UTC(p.y, p.mo, 0)).getUTCDate();
  $("#calTitle").textContent = F(evs[0].start, { month: "long", year: "numeric" });
  const wd = [...Array(7)].map((_, i) => `<i>${new Intl.DateTimeFormat(L("loc"), { weekday: "short", timeZone: "UTC" }).format(Date.UTC(2023, 0, 1 + i))}</i>`);
  const cells = [...Array(first.getUTCDay())].map(() => "<span></span>").concat([...Array(days)].map((_, i) => `<span${i + 1 === p.d ? ' class="me"' : ""}>${i + 1}</span>`));
  $("#cal").innerHTML = wd.concat(cells).join("");
  // one arch-framed scene per enabled event (keeps already-visible scenes visible when switching language)
  const was = [...document.querySelectorAll("#evScenes .scene")].map((s) => s.classList.contains("in"));
  $("#evScenes").innerHTML = evs.map((e) => `<section class="scene">
    <p class="bis sm" lang="ar" dir="rtl">بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ</p>
    <p class="ar2" lang="ar" dir="rtl">إِنْ شَاءَ ٱللَّهُ</p>
    <p class="eyebrow">${L("join")}</p>
    <h2 class="script ttl">${tr(e.title)}</h2>
    <div class="dt"><span>${F(e.start, { weekday: "long" })}</span><span class="big">${F(e.start, { month: "short" })}<b>${P(e.start).d}</b>${P(e.start).y}</span><span>${F(e.start, { timeStyle: "short" })}</span></div>
    <p><svg class="pin" viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg> <strong>${e.venue}</strong><br><span class="sub">${e.address}</span></p>
    ${tr(e.dress) ? `<p class="sub">${L("dress")}: ${tr(e.dress)}</p>` : ""}
    <a class="btn" href="${mapLink(e)}" target="_blank" rel="noopener">${L("map")}</a></section>`).join("");
  document.querySelectorAll("#evScenes .scene").forEach((s, i) => { decorate(s); io.observe(s); if (was[i]) s.classList.add("in"); });
  const n = CONFIG.notes[lang] || [];
  $("#notes").innerHTML = n.map((x) => `<li>${x}</li>`).join("");
  $("#sNotes").hidden = !n.length;
  const checked = [...document.querySelectorAll("#evChecks input:checked")].map((i) => i.value);
  $("#evChecks").innerHTML = evs.map((e) => `<label><input type="checkbox" value="${e.id}" ${checked.includes(e.id) ? "checked" : ""}>${tr(e.title)}</label>`).join("");
  musicBtn(); tick();
}
function tick() {
  const diff = target - Date.now();
  if (diff <= 0) { $("#count").textContent = L("expired"); return; }
  const v = [Math.floor(diff / 864e5), Math.floor(diff / 36e5) % 24, Math.floor(diff / 6e4) % 60, Math.floor(diff / 1e3) % 60];
  $("#count").innerHTML = ["d", "h", "m", "s"].map((k, i) => `<div><b>${String(v[i]).padStart(2, "0")}</b><small>${L(k)}</small></div>`).join("");
}
document.querySelectorAll("[data-lang]").forEach((b) => b.addEventListener("click", () => { lang = b.dataset.lang; try { localStorage.setItem("lang", lang); } catch (e) {} render(); }));

/* Envelope: seal breaks, flap opens, card rises, then scenes begin */
const intro = $("#intro");
function openEnv(fast) {
  intro.classList.add("open");
  setTimeout(() => { intro.classList.add("done"); document.body.classList.remove("locked"); scrollTo(0, 0); $("#main").focus({ preventScroll: true }); setTimeout(startScenes, 250); }, fast ? 0 : 2800);
}
$("#seal").addEventListener("click", () => openEnv(false));
$("#skip").addEventListener("click", () => openEnv(true));
$("#replay").addEventListener("click", () => { io.disconnect(); scenes().forEach((s) => s.classList.remove("in")); intro.classList.remove("open", "done"); document.body.classList.add("locked"); scrollTo(0, 0); });

/* RSVP (validation here; delivery by WhatsApp if a number is configured) */
$("#rsvpForm").addEventListener("submit", (ev) => {
  ev.preventDefault();
  const f = ev.target, name = f.name.value.trim(), picked = [...f.querySelectorAll("#evChecks input:checked")].map((i) => i.value);
  const err = !name ? L("errName") : f.status.value === "yes" && !picked.length ? L("errEv") : "";
  $("#err").textContent = err; $("#ok").textContent = "";
  if (err) return;
  $("#ok").textContent = L("ok");
  const text = `RSVP: ${name}\nGuests: ${f.guests.value}\nStatus: ${f.status.value}\nEvents: ${picked.join(", ")}\n${f.msg.value}`;
  if (CONFIG.rsvp.whatsapp) open(`https://wa.me/${CONFIG.rsvp.whatsapp}?text=${encodeURIComponent(text)}`, "_blank", "noopener");
});
/* Add to calendar (.ics), WhatsApp share, copy link */
$("#calBtn").addEventListener("click", () => {
  const z = (d) => new Date(d).toISOString().replace(/[-:]|\.\d{3}/g, "");
  const ics = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Invite//EN", ...evs.flatMap((e) => ["BEGIN:VEVENT", `UID:${e.id}@invite`, `DTSTAMP:${z(Date.now())}`, `DTSTART:${z(e.start)}`, `DTEND:${z(new Date(e.start).getTime() + 3 * 36e5)}`, `SUMMARY:${e.title.en} - ${CONFIG.couple.groom.en} & ${CONFIG.couple.bride.en}`, `LOCATION:${e.venue}\\, ${e.address}`, "END:VEVENT"]), "END:VCALENDAR"].join("\r\n");
  const a = Object.assign(document.createElement("a"), { href: URL.createObjectURL(new Blob([ics], { type: "text/calendar" })), download: "wedding.ics" });
  a.click(); URL.revokeObjectURL(a.href);
});
$("#wa").addEventListener("click", () => open("https://wa.me/?text=" + encodeURIComponent(`${L("waMsg")} ${names()}\n${location.href}`), "_blank", "noopener"));
$("#copy").addEventListener("click", async () => {
  try { await navigator.clipboard.writeText(location.href); } catch (e) { prompt("", location.href); return; }
  const b = $("#copy"), old = b.textContent; b.textContent = L("copied"); setTimeout(() => (b.textContent = old), 1800);
});
$("#top").addEventListener("click", () => scrollTo({ top: 0 }));
/* Music: silent by default, plays only after a tap */
const mb = $("#music");
function musicBtn() { mb.hidden = !CONFIG.music.src; mb.textContent = audio && !audio.paused ? "❚❚ " + L("mute") : "▶ " + L("music"); }
mb.addEventListener("click", () => { audio = audio || Object.assign(new Audio(CONFIG.music.src), { loop: true }); audio.paused ? audio.play().catch(() => {}) : audio.pause(); musicBtn(); });

scenes().forEach(decorate);
render();
setInterval(tick, 1000);
</script>
</body>
</html>
